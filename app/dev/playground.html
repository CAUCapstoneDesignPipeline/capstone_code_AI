<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Playground</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #fff; --ink: #1d1d1b; --muted: #77766f; --line: #e3e2dc; --soft: #efeee9;
  --accent: #3b5bdb; --accent-soft: #e7ecff; --mark: #fff1b8; --mark-on: #ffd43b; --err: #c92a2a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9b9a93; --line: #34332f; --soft: #2a2a27;
    --accent: #8ea4ff; --accent-soft: #263055; --mark: #4a4220; --mark-on: #8a6d00; --err: #ff8787;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100vh; }
aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
.search { margin: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--bg); }
.notes { list-style: none; margin: 0; padding: 0 6px 12px; overflow: auto; flex: 1; }
.notes button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.notes button:hover { background: var(--soft); }
.notes button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
.api { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--bg); }
.api button { border: 0; background: none; padding: 7px 16px; border-radius: 7px; font-weight: 600; color: var(--muted); }
.api button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.thr { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--muted); font-size: 13px; }
.thr input { width: 160px; accent-color: var(--accent); }
.thr b { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 34px; }

.body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 16px 20px; min-height: 0; flex: 1; overflow: hidden; }
.body.single { grid-template-columns: minmax(0, 1fr); }
.col { min-height: 0; overflow: auto; }
h1 { font-size: 18px; margin: 0 0 10px; overflow-wrap: anywhere; }
pre.text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; line-height: 1.75;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
textarea { width: 100%; min-height: 60vh; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--panel); line-height: 1.7; }
.m { background: var(--mark); border-radius: 3px; cursor: pointer; }
.m.on { background: var(--mark-on); }

.list { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.list li + li { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 7px 12px; }
.row:hover { background: var(--soft); }
.row[aria-current="true"] { background: var(--accent-soft); }
.row .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conf { font-variant-numeric: tabular-nums; font-size: 13px; }
.meter { width: 60px; height: 5px; border-radius: 3px; background: var(--soft); overflow: hidden; flex: none; }
.meter i { display: block; height: 100%; background: var(--accent); }
.invalid { opacity: .45; }
.cut { padding: 6px 12px; font-size: 12px; color: var(--muted); background: var(--bg); }
.count { color: var(--muted); font-size: 13px; margin: 0 0 8px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.cardHead { display: flex; align-items: center; gap: 10px; }
.cardHead button { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cardHead button:hover { color: var(--accent); }
.score { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid var(--line); border-radius: 99px; padding: 1px 10px; font-size: 13px; background: var(--bg); }
.chip small { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.status { flex: none; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; }
.status.candidate { background: #d3f9d8; color: #2b8a3e; }
.status.hypothesis { background: #fff3bf; color: #946200; }
.status.excluded { background: #ffe3e3; color: #c92a2a; }
.know { font-size: 15px; font-weight: 600; margin: 8px 0 4px; }
.path { font-size: 13px; color: var(--muted); }
.path b { color: var(--ink); font-weight: 600; }
.steps { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.steps li { font-size: 13px; }
.quote { margin: 2px 0 0 10px; padding-left: 8px; border-left: 3px solid var(--accent); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.checks span { border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 8px; }
.graphWrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.graphWrap svg { display: block; width: 100%; height: auto; }
.gEdge { stroke: var(--line); cursor: pointer; }
.gEdge.center { stroke: var(--muted); }
.gEdge.on { stroke: var(--accent); }
.gHit { stroke: transparent; stroke-width: 16; cursor: pointer; }
.gNode rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
.gNode.center rect { fill: var(--accent-soft); stroke: var(--accent); }
.gNode.end rect { stroke: var(--accent); }
.gNode { cursor: pointer; }
.gNode text { fill: var(--ink); font-size: 13px; }
.gLabel { fill: var(--muted); font-size: 11px; pointer-events: none; }
.scope { display: inline-flex; gap: 4px; margin: 0 0 10px; }
.scope button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.scope button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.allWrap svg { cursor: grab; touch-action: none; }
.aNode { cursor: pointer; }
.aNode circle { fill: var(--muted); stroke: var(--panel); stroke-width: 1.5; }
.aNode.cur circle { fill: var(--accent); }
.aNode.sel circle { fill: var(--accent); stroke: var(--ink); stroke-width: 2; }
.aNode.dim { opacity: .25; }
.aNode text { fill: var(--ink); font-size: 11px; pointer-events: none; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
.aEdge { stroke: var(--line); }
.aEdge.hl { stroke: var(--muted); }
.aEdge.on { stroke: var(--accent); }
.aEdge.dim { opacity: .2; }
.list2 { list-style: none; margin: 0; padding: 0; }
.list2 button { display: flex; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 5px 2px; font-size: 13px; color: var(--ink); }
.list2 button:hover { color: var(--accent); }
.list2 small { color: var(--muted); margin-left: auto; }
.linkBtn { border: 0; background: none; color: var(--accent); padding: 0; font-size: 12px; }
.side h3 { font-size: 15px; margin: 0 0 4px; overflow-wrap: anywhere; }
.side h4 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); }
.side .note { font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
.side .chain { font-size: 13px; margin: 6px 0; }
.side .rule { font-size: 11px; padding: 0 6px; border-radius: 99px; background: var(--soft); color: var(--muted); }
.side .rule.yes { background: var(--accent-soft); color: var(--accent); }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.error { color: var(--err); white-space: pre-wrap; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%;
  animation: spin .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 200px minmax(0, 1fr); }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  .bar { padding: 10px 16px; }
  .thr { margin-left: 0; }
  .body { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; overflow: auto; }
  .col { overflow: visible; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <input class="search" id="search" placeholder="노트 검색" autocomplete="off">
    <ul class="notes" id="notes"></ul>
  </aside>
  <main>
    <div class="bar">
      <div class="api" role="group" aria-label="API">
        <button data-mode="concepts" aria-pressed="false">개념 추출</button>
        <button data-mode="links" aria-pressed="false">관계 연결</button>
        <button data-mode="suggest" aria-pressed="false">지식 제안</button>
      </div>
      <label class="thr">유효 개념 신뢰도 ≥
        <input type="range" id="thr" min="0.25" max="1" step="0.01" value="0.35"><b id="thrVal">0.35</b></label>
    </div>
    <div class="body single" id="body"><p class="empty">노트를 고른다</p></div>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const FREE = "\u0000free";
const S = { cfg: null, notes: [], note: null, text: "", free: "", mode: null, thr: 0.35, concepts: null, links: null, sel: null, edge: null, run: 0,
            scope: "note", all: null, allSel: null, allEdge: null, allDetail: null, view: { x: 0, y: 0, k: 1 } };
const name = (id) => (id === FREE ? "직접 입력" : id);
const valid = (c) => c.confidence >= S.thr;

// ---------- 노트 ----------
async function init() {
  S.cfg = await (await fetch("/dev/config")).json();
  S.notes = await (await fetch("/dev/notes")).json();
  fetch("/dev/index");                                    // 노트 사이 연결 색인을 미리 만든다
  renderNotes();
  await openNote(S.notes.find((n) => n === "DB-WAL") || S.notes[0] || FREE);
  setMode("concepts");
}
function renderNotes() {
  const q = $("#search").value.normalize("NFC").trim().toLowerCase();
  const items = [FREE, ...S.notes.filter((n) => !q || n.toLowerCase().includes(q))];
  $("#notes").innerHTML = items.map((n) => `<li><button data-note="${n === FREE ? "" : esc(n)}" aria-current="${n === S.note}" title="${esc(name(n))}">
    ${n === FREE ? "✎ " : ""}${esc(name(n))}</button></li>`).join("");
  document.querySelectorAll("[data-note]").forEach((b) => b.addEventListener("click", () => openNote(b.dataset.note || FREE).then(run)));
}
$("#search").addEventListener("input", renderNotes);

async function openNote(id) {
  if (S.note === FREE) S.free = $("#free")?.value ?? S.free;
  S.note = id; S.concepts = null; S.links = null; S.suggest = null; S.sel = null;
  S.text = id === FREE ? S.free : (await (await fetch("/dev/notes/" + encodeURIComponent(id))).json()).body;
  renderNotes(); render();
}
function currentText() {
  if (S.note === FREE) S.free = S.text = ($("#free")?.value ?? S.free).normalize("NFC");
  return S.text;
}

// ---------- API 버튼: 누르면 바로 실행 ----------
function setMode(m) {
  S.mode = m;
  document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === m));
  run();
}
document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));

let thrTimer;
$("#thr").addEventListener("input", (e) => {
  S.thr = Number(e.target.value);
  $("#thrVal").textContent = S.thr.toFixed(2);
  if (S.mode === "concepts") render();                    // 개념은 화면에서 바로 다시 가른다
  else if (S.mode === "suggest") { clearTimeout(thrTimer); thrTimer = setTimeout(run, 400); }
  else { clearTimeout(thrTimer); thrTimer = setTimeout(run, 250); }   // 연결은 유효 개념이 바뀌었으니 다시 찾는다
});

function run() { return ({ links: () => (S.scope === "all" ? runAll() : runLinks()), suggest: runSuggest })[S.mode]?.() ?? runConcepts(); }

async function runSuggest() {
  const text = currentText();
  if (!text.trim()) { S.suggest = null; return render(); }
  const r = ++S.run;
  S.suggest = "loading"; render();
  const body = { k: 5, minConfidence: S.thr, ...(S.note === FREE ? { text } : { noteId: S.note }) };
  try {
    const res = await fetch("/dev/suggest", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (r !== S.run) return;
    S.suggest = res.ok ? data : { error: data.detail || `HTTP ${res.status}` };
  } catch (e) { if (r === S.run) S.suggest = { error: String(e) }; }
  render();
}

async function sha256Hex(bytes) {
  return [...new Uint8Array(await crypto.subtle.digest("SHA-256", bytes))].map((b) => b.toString(16).padStart(2, "0")).join("");
}

async function runConcepts() {
  const text = currentText();
  if (!text.trim()) { S.concepts = null; return render(); }
  const r = ++S.run;
  S.concepts = "loading"; render();
  const id = crypto.randomUUID();
  const types = [...S.cfg.relationTypes, { code: "analogous_to", label: "유사", description: "두 개념이 비슷한 원리로 동작한다" }];
  const ctx = { analysisJobId: crypto.randomUUID(), stageExecutionId: crypto.randomUUID(), userId: crypto.randomUUID(),
                noteId: id, noteVersion: 1, inputRevision: 1, graphRevision: 1, pipelineVersion: "playground" };
  const body = { context: ctx, profileVersion: S.cfg.extractProfiles.find((p) => p.default).id,
    note: { noteId: id, noteVersion: 1, inputRevision: 1, title: name(S.note).slice(0, 200), body: text,
            bodySha256: await sha256Hex(new TextEncoder().encode(text)), topic: { id: null, name: "미분류" } },
    policy: { version: "playground", relationTypes: types, compositionRules: [] } };
  const raw = new TextEncoder().encode(JSON.stringify(body));
  try {
    const res = await fetch(S.cfg.apiPrefix + "/extract", { method: "POST", body: raw, headers: {
      "Authorization": "Bearer " + (S.cfg.token || ""), "Content-Type": "application/json", "X-Request-Id": crypto.randomUUID(),
      "X-Attempt-Id": crypto.randomUUID(), "Idempotency-Key": ctx.stageExecutionId, "X-Input-SHA256": await sha256Hex(raw) } });
    const data = await res.json().catch(() => null);
    if (r !== S.run) return;
    S.concepts = res.ok ? data.concepts : { error: data?.error ? `${data.error.code}: ${data.error.message}` : `HTTP ${res.status}` };
  } catch (e) { if (r === S.run) S.concepts = { error: String(e) }; }
  render();
}

async function runLinks() {
  const text = currentText();
  if (!text.trim()) { S.links = null; return render(); }
  const r = ++S.run;
  S.links = "loading"; render();
  const body = { k: 8, minConfidence: S.thr, ...(S.note === FREE ? { text } : { noteId: S.note }) };
  try {
    const res = await fetch("/dev/graph", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (r !== S.run) return;
    S.links = res.ok ? data : { error: data.detail || `HTTP ${res.status}` };
    if (res.ok) {                                   // 처음에는 가운데 노트와 가장 강한 선을 골라 둔다
      const first = data.edges.filter((e) => e.a === data.center || e.b === data.center).sort((x, y) => y.score - x.score)[0];
      S.edge = first ? edgeKey(first) : null;
    }
  } catch (e) { if (r === S.run) S.links = { error: String(e) }; }
  render();
}

// ---------- 관계 연결 그래프 ----------
const TYPE_KO = { is_a: "종류", part_of: "구성", causes: "원인", requires: "필요", used_for: "용도",
                  contrasts_with: "대비", example_of: "예시", analogous_to: "유사" };
const scopeToggle = () => `<div class="scope" role="group" aria-label="범위">
  <button data-scope="note" aria-pressed="${S.scope === "note"}">이 노트</button>
  <button data-scope="all" aria-pressed="${S.scope === "all"}">전체 문서</button></div>`;
const edgeKey = (e) => [e.a, e.b].sort().join("\u0001");
const shortTitle = (id, n = 16) => {
  const t = (id === FREE ? "직접 입력" : id).replace(/\s+[0-9a-f]{32}$/, "");
  return t.length > n ? t.slice(0, n - 1) + "…" : t;
};

// ---------- 힘 기반 배치 (실시간): 노트끼리 밀어내고 선은 당긴다. 노트를 끌어 옮길 수 있다 ----------
function makeSim(nodes, edges, o) {
  const idx = {}, max = Math.max(...edges.map((e) => e.score), 1e-9);
  const N = nodes.map((v, i) => { idx[v.id] = i; const p = o.start(v, i); return { id: v.id, x: p[0], y: p[1], vx: 0, vy: 0, fx: p[2] ?? null, fy: p[3] ?? null, r: o.radius(v) }; });
  const L = edges.filter((e) => e.a in idx && e.b in idx).map((e) => ({ s: idx[e.a], t: idx[e.b], w: 0.3 + 0.7 * e.score / max, len: o.len(e.score / max) }));
  return { N, L, o, alpha: 1, running: false, svg: null };
}

function tick(sim) {
  const { N, L, o } = sim, a = sim.alpha, n = N.length;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {           // 밀어내기 + 겹침 방지
    const A = N[i], B = N[j];
    let dx = A.x - B.x, dy = A.y - B.y, d2 = dx * dx + dy * dy;
    if (d2 < 1) { dx = (i - j) * 0.5; dy = 0.3; d2 = dx * dx + dy * dy; }
    const d = Math.sqrt(d2), f = o.charge * a / d2, min = A.r + B.r;
    let px = dx / d * f * d, py = dy / d * f * d;
    if (d < min) { const k = (min - d) / d * 0.5; px += dx * k; py += dy * k; }
    A.vx += px; A.vy += py; B.vx -= px; B.vy -= py;
  }
  for (const l of L) {                                                       // 선 = 용수철 (강한 연결일수록 짧고 세다)
    const S1 = N[l.s], T = N[l.t];
    const dx = T.x + T.vx - S1.x - S1.vx, dy = T.y + T.vy - S1.y - S1.vy, d = Math.hypot(dx, dy) || 1;
    const f = (d - l.len) / d * a * o.spring * l.w;
    T.vx -= dx * f * 0.5; T.vy -= dy * f * 0.5; S1.vx += dx * f * 0.5; S1.vy += dy * f * 0.5;
  }
  for (const v of N) {
    if (v.fx != null) { v.x = v.fx; v.y = v.fy; v.vx = v.vy = 0; continue; }
    v.vx += (o.W / 2 - v.x) * o.gravity * a; v.vy += (o.H / 2 - v.y) * o.gravity * a;
    v.vx *= 0.6; v.vy *= 0.6; v.x += v.vx; v.y += v.vy;
    v.x = Math.min(o.W - v.r, Math.max(v.r, v.x)); v.y = Math.min(o.H - 20, Math.max(20, v.y));
  }
  sim.alpha += (0.001 - sim.alpha) * 0.02;
}

function paint(sim) {
  const svg = sim.svg; if (!svg || !svg.isConnected) return;
  const pos = {};
  sim.N.forEach((v) => { pos[v.id] = v; });
  svg.querySelectorAll("[data-pid]").forEach((g) => { const v = pos[g.dataset.pid]; if (v) g.setAttribute("transform", `translate(${v.x.toFixed(1)} ${v.y.toFixed(1)})`); });
  svg.querySelectorAll("[data-la]").forEach((el) => {
    const A = pos[el.dataset.la], B = pos[el.dataset.lb]; if (!A || !B) return;
    if (el.tagName === "text") { el.setAttribute("x", ((A.x + B.x) / 2).toFixed(1)); el.setAttribute("y", ((A.y + B.y) / 2 - 6).toFixed(1)); }
    else { el.setAttribute("x1", A.x.toFixed(1)); el.setAttribute("y1", A.y.toFixed(1)); el.setAttribute("x2", B.x.toFixed(1)); el.setAttribute("y2", B.y.toFixed(1)); }
  });
}

function runSim(sim) {
  if (sim.running) return;
  sim.running = true;
  const frame = () => {
    if (!sim.svg || !sim.svg.isConnected) { sim.running = false; return; }
    for (let i = 0; i < 3; i++) tick(sim);
    paint(sim);
    if (sim.alpha > 0.01 || sim.dragging) requestAnimationFrame(frame); else sim.running = false;
  };
  requestAnimationFrame(frame);
}

// 새로 그린 SVG 에 시뮬레이션을 붙인다. 위치는 시뮬레이션에 남아 있어 다시 그려도 튀지 않는다
function attachSim(svg, sim) {
  sim.svg = svg; paint(sim); runSim(sim);
  const space = svg.querySelector("#vp") || svg;
  const toLocal = (ev) => { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; return pt.matrixTransform(space.getScreenCTM().inverse()); };
  svg.querySelectorAll("[data-pid]").forEach((g) => {
    g.addEventListener("pointerdown", (ev) => {
      const v = sim.N.find((x) => x.id === g.dataset.pid); if (!v) return;
      ev.stopPropagation(); try { g.setPointerCapture(ev.pointerId); } catch (e) { /* 합성 이벤트 등 */ }
      const pinned = v.fx != null && v.pinned, start = toLocal(ev);
      let moved = false;
      sim.dragging = true; v.fx = v.x; v.fy = v.y; sim.alpha = Math.max(sim.alpha, 0.3); runSim(sim);
      const move = (e) => { const p = toLocal(e); if (Math.hypot(p.x - start.x, p.y - start.y) > 4) moved = true; v.fx = p.x; v.fy = p.y; };
      const up = () => {
        g.removeEventListener("pointermove", move); g.removeEventListener("pointerup", up);
        sim.dragging = false; if (!v.pinned) { v.fx = null; v.fy = null; }
        if (moved) g.dataset.dragged = "1";
      };
      g.addEventListener("pointermove", move); g.addEventListener("pointerup", up);
    });
  });
}
const wasDragged = (el) => { if (el.dataset.dragged) { delete el.dataset.dragged; return true; } return false; };

function graphSvg(L) {
  const W = 760, H = 520;
  if (!L.sim) {
    const others = L.nodes.slice(1);
    L.sim = makeSim(L.nodes, L.edges, {
      W, H, charge: 1400, spring: 0.25, gravity: 0.06,
      len: (s) => 230 - 110 * s,
      radius: (v) => Math.max(35, shortTitle(v.id).length * 6.5 + 10),
      start: (v, i) => {
        if (i === 0) return [W / 2, H / 2, W / 2, H / 2];                        // 가운데 노트는 고정
        const t = -Math.PI / 2 + (2 * Math.PI * (i - 1)) / others.length;
        return [W / 2 + 260 * Math.cos(t), H / 2 + 180 * Math.sin(t)];
      },
    });
    L.sim.N[0].pinned = true;
  }
  const max = Math.max(...L.edges.map((e) => e.score), 1e-9);
  const sel = L.edges.find((e) => edgeKey(e) === S.edge);
  const ends = sel ? new Set([sel.a, sel.b]) : new Set();
  const lines = L.edges.map((e) => {
    const k = edgeKey(e), on = k === S.edge, isCenter = e.a === L.center || e.b === L.center;
    const w = (1.2 + 6 * e.score / max).toFixed(1), top = e.bridges[0] ? e.bridges[0].labelA : "";
    const ab = `data-la="${esc(e.a)}" data-lb="${esc(e.b)}"`;
    return `<g><line class="gEdge${isCenter ? " center" : ""}${on ? " on" : ""}" ${ab} stroke-width="${on ? Math.max(3, +w) : w}"/>
      <line class="gHit" data-edge="${esc(k)}" ${ab}><title>${esc(e.bridges.map((b) => b.labelA).join(", "))}</title></line>
      ${isCenter || on ? `<text class="gLabel" ${ab} text-anchor="middle">${esc(top)}</text>` : ""}</g>`;
  }).join("");
  const nodes = L.nodes.map((n) => {
    const label = shortTitle(n.id), w = Math.max(70, label.length * 13 + 20);
    const cls = n.id === L.center ? " center" : ends.has(n.id) ? " end" : "";
    return `<g class="gNode${cls}" data-node="${esc(n.id)}" data-pid="${esc(n.id)}"><title>${esc(n.id)}</title>
      <rect x="${-w / 2}" y="-17" width="${w}" height="34" rx="9"/><text y="5" text-anchor="middle">${esc(label)}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="노트 연결 그래프">${lines}${nodes}</svg>`;
}

function edgePanel(L) {
  const e = L.edges.find((x) => edgeKey(x) === S.edge);
  if (!e) return `<p class="empty">선을 누르면 두 노트가 어떻게 이어지는지 여기에 나온다.</p>`;
  return edgeDetail(e, L.center);
}

function edgeDetail(e, center) {
  const A = shortTitle(e.a, 28), B = shortTitle(e.b, 28);
  const concepts = e.bridges.map((b) => `<div class="card" style="padding:10px 12px">
      <b>${esc(b.labelA === b.labelB ? b.labelA : `${b.labelA} = ${b.labelB}`)}</b>
      <p class="note">${esc(A)}</p><div class="quote">${esc(b.quoteA || "—")}</div>
      <p class="note">${esc(B)}</p><div class="quote">${esc(b.quoteB || "—")}</div></div>`).join("");
  const chains = e.paths.map((p) => {
    const [s1, s2] = p.steps;
    const step = (st) => `<div class="chain">${esc(st.from)} <span class="rule">${esc(TYPE_KO[st.type] || st.type)}</span> ${esc(st.to)}
        <p class="note">${esc(shortTitle(st.note, 28))}</p>${st.quote ? `<div class="quote">${esc(st.quote)}</div>` : ""}</div>`;
    return `<div class="card" style="padding:10px 12px">${step(s1)}${step(s2)}
      <p class="note">→ <b>${esc(s1.from)}</b> 와 <b>${esc(s2.to)}</b> ${p.rule ? `<span class="rule yes">${esc(TYPE_KO[p.rule] || p.rule)}</span>` : `<span class="rule">규칙 없음</span>`}</p></div>`;
  }).join("");
  return `<h3>${esc(A)} ↔ ${esc(B)}</h3>
    <p class="note">연결 점수 ${e.score} · ${center ? `<button class="linkBtn" data-open="${esc(e.a === center ? e.b : e.a)}">이 노트로 →</button>`
      : `<button class="linkBtn" data-focus="${esc(e.a)}">${esc(shortTitle(e.a, 14))} 중심으로 →</button> · <button class="linkBtn" data-focus="${esc(e.b)}">${esc(shortTitle(e.b, 14))} 중심으로 →</button>`}</p>
    <h4>함께 다루는 개념 ${e.bridges.length}</h4>${concepts}
    ${chains ? `<h4>두 노트를 가로지르는 관계 ${e.paths.length}</h4>${chains}` : `<h4>두 노트를 가로지르는 관계</h4><p class="note">한 노트의 관계가 다른 노트의 관계로 이어지는 곳은 없다.</p>`}`;
}

// ---------- 전체 문서 그래프 ----------
async function runAll() {
  if (S.note && S.note !== FREE) S.allSel = S.allSel || S.note;
  if (S.all && S.all !== "loading" && !S.all.error && S.all.thr === S.thr) return render();
  const r = ++S.run;
  S.all = "loading"; S.allEdge = null; S.allDetail = null; render();
  try {
    const res = await fetch("/dev/graph/all", { method: "POST", headers: { "Content-Type": "application/json" },
                                                body: JSON.stringify({ k: 3, minConfidence: S.thr }) });
    const data = await res.json().catch(() => ({}));
    if (r !== S.run) return;
    if (!res.ok) S.all = { error: data.detail || `HTTP ${res.status}` };
    else { data.thr = S.thr; S.all = data; S.view = { x: 0, y: 0, k: 1 }; }
  } catch (e) { if (r === S.run) S.all = { error: String(e) }; }
  render();
}

function allSvg(G) {
  const W = 1000, H = 720;
  if (!G.sim) {
    const iso = G.nodes.filter((v) => !v.degree), isoIdx = {};
    iso.forEach((v, i) => { isoIdx[v.id] = i; });
    G.sim = makeSim(G.nodes, G.edges, {
      W, H, charge: 50, spring: 0.6, gravity: 0.03,
      len: (s) => 45 - 20 * s,
      radius: (v) => 6 + 1.6 * Math.sqrt(v.degree),
      start: (v, i) => {
        if (v.id in isoIdx) {                                                    // 연결 없는 노트는 맨 아래 줄에 고정
          const x = 40 + (W - 80) * (isoIdx[v.id] + 0.5) / iso.length;
          return [x, H - 25, x, H - 25];
        }
        const r = 27 * Math.sqrt(i + 1), t = i * 2.39996;                        // 최종 크기에 가까운 나선에서 시작
        return [W / 2 + r * Math.cos(t), (H - 60) / 2 + r * Math.sin(t) * 0.75];
      },
    });
    G.sim.N.forEach((v) => { if (v.fx != null) v.pinned = true; });
    G.sim.o.H = H - 50;                                                          // 연결된 노트는 아래 줄 위쪽에서 움직인다
  }
  const max = Math.max(...G.edges.map((e) => e.score), 1e-9);
  const sel = S.allSel, nb = new Set();
  if (sel) G.edges.forEach((e) => { if (e.a === sel) nb.add(e.b); if (e.b === sel) nb.add(e.a); });
  const topLabels = new Set([...G.nodes].sort((x, y) => y.degree - x.degree).slice(0, 14).map((v) => v.id));
  const lines = G.edges.map((e) => {
    const k = edgeKey(e), touch = sel && (e.a === sel || e.b === sel);
    const cls = k === S.allEdge ? " on" : touch ? " hl" : sel ? " dim" : "";
    const ab = `data-la="${esc(e.a)}" data-lb="${esc(e.b)}"`;
    return `<line class="aEdge${cls}" ${ab} stroke-width="${(0.8 + 4 * e.score / max).toFixed(1)}"/>
      <line class="gHit" data-aedge="${esc(k)}" ${ab}><title>${esc(shortTitle(e.a, 24))} ↔ ${esc(shortTitle(e.b, 24))} · ${esc(e.top)}</title></line>`;
  }).join("");
  const nodes = G.nodes.map((v) => {
    const r = 4 + 1.6 * Math.sqrt(v.degree);
    const cls = v.id === sel ? " sel" : v.id === S.note ? " cur" : sel && !nb.has(v.id) ? " dim" : "";
    const show = v.id === sel || nb.has(v.id) || v.id === S.note || (!sel && topLabels.has(v.id));
    return `<g class="aNode${cls}" data-anode="${esc(v.id)}" data-pid="${esc(v.id)}"><title>${esc(v.id)} · 연결 ${v.degree}</title>
      <circle r="${r.toFixed(1)}"/>${show ? `<text y="${(-r - 4).toFixed(1)}" text-anchor="middle">${esc(shortTitle(v.id, 14))}</text>` : ""}</g>`;
  }).join("");
  const { x, y, k } = S.view;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="전체 문서 연결 그래프"><g id="vp" transform="translate(${x} ${y}) scale(${k})">${lines}${nodes}</g></svg>`;
}

function allPanel(G) {
  if (S.allEdge) {
    if (S.allDetail === "loading") return `<p class="count"><span class="spin"></span>설명을 불러오는 중…</p>`;
    if (S.allDetail?.error) return `<p class="error">${esc(S.allDetail.error)}</p>`;
    if (S.allDetail) return edgeDetail(S.allDetail, null);
  }
  if (S.allSel) {
    const mine = G.edges.filter((e) => e.a === S.allSel || e.b === S.allSel);
    return `<h3>${esc(shortTitle(S.allSel, 40))}</h3>
      <p class="note">연결 ${mine.length} · <button class="linkBtn" data-focus="${esc(S.allSel)}">이 노트 중심으로 보기 →</button></p>
      <h4>이어진 노트 (선을 눌러도 된다)</h4>
      <ul class="list2">${mine.map((e) => { const o = e.a === S.allSel ? e.b : e.a; return `<li><button data-aedge="${esc(edgeKey(e))}">
        ${esc(shortTitle(o, 26))}<small>${esc(e.top)}</small></button></li>`; }).join("") || `<li class="note">이어진 노트가 없다.</li>`}</ul>`;
  }
  return `<p class="empty">점(노트)이나 선을 누른다. 휠로 확대, 끌어서 이동한다.</p>`;
}

async function loadEdge(key) {
  const [a, b] = key.split("\u0001");
  S.allEdge = key; S.allDetail = "loading"; render();
  try {
    const res = await fetch("/dev/graph/edge", { method: "POST", headers: { "Content-Type": "application/json" },
                                                 body: JSON.stringify({ a, b, minConfidence: S.thr }) });
    const data = await res.json().catch(() => ({}));
    if (S.allEdge !== key) return;
    S.allDetail = res.ok ? data : { error: data.detail || `HTTP ${res.status}` };
  } catch (e) { if (S.allEdge === key) S.allDetail = { error: String(e) }; }
  render();
}

function bindPanZoom(svg) {
  const vp = svg.querySelector("#vp");
  const apply = () => vp.setAttribute("transform", `translate(${S.view.x} ${S.view.y}) scale(${S.view.k})`);
  const toSvg = (ev) => { const r = svg.getBoundingClientRect(); return [(ev.clientX - r.left) * 1000 / r.width, (ev.clientY - r.top) * 720 / r.height]; };
  svg.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const [mx, my] = toSvg(ev), f = ev.deltaY < 0 ? 1.15 : 1 / 1.15, k = Math.min(6, Math.max(0.5, S.view.k * f));
    S.view.x = mx - (mx - S.view.x) * (k / S.view.k); S.view.y = my - (my - S.view.y) * (k / S.view.k); S.view.k = k; apply();
  }, { passive: false });
  let drag = null;
  svg.addEventListener("pointerdown", (ev) => { if (ev.target.closest("[data-anode],[data-aedge]")) return; drag = [...toSvg(ev), S.view.x, S.view.y]; try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* 합성 이벤트 등 */ } });
  svg.addEventListener("pointermove", (ev) => { if (!drag) return; const [mx, my] = toSvg(ev); S.view.x = drag[2] + mx - drag[0]; S.view.y = drag[3] + my - drag[1]; apply(); });
  svg.addEventListener("pointerup", () => { drag = null; });
}

// ---------- 화면 ----------
function render() {
  const body = $("#body");
  const head = `<h1>${esc(name(S.note))}</h1>`;
  const source = S.note === FREE
    ? `<textarea id="free" placeholder="글을 붙여넣고 위 버튼을 누른다">${esc(S.free)}</textarea>`
    : `<pre class="text" id="text">${S.mode === "concepts" && Array.isArray(S.concepts) ? marked() : esc(S.text)}</pre>`;
  const loading = `<p class="count"><span class="spin"></span>실행 중…</p>`;

  if (S.mode === "suggest") {
    body.className = "body single";
    const G = S.suggest;
    let out = S.note === FREE ? `<div style="margin-bottom:12px">${source}</div>` : "";
    const STATUS = { candidate: "후보", hypothesis: "가설", excluded: "제외" };
    const OUT = { entailed: "근거 있음", contradicted: "근거가 부정", unknown: "근거 불분명", same: "같은 개념", different: "다른 개념",
                  uncertain: "애매", pass: "통과", fail: "실패" };
    if (G === "loading") out += `<p class="count"><span class="spin"></span>연결 찾기 → 매개 개념·간선 검증 → 설명 생성 → 설명 검증…</p>`;
    else if (G?.error) out += `<p class="error">${esc(G.error)}</p>`;
    else if (G) {
      out += `<p class="count">이어진 노트 ${G.links.length}개 · 두 노트의 관계를 이어 만든 제안 ${G.suggestions.length}개 · ${G.ms}ms</p>`;
      out += G.suggestions.map((s) => {
        const [s1, s2] = s.steps;
        const step = (st) => `<li>${esc(st.fromLabel)} —${esc(st.typeCode)}→ ${esc(st.toLabel)} <span class="path">· ${esc(st.note)}</span>
          ${st.evidence.map((e) => `<div class="quote">${esc(e.quote)}</div>`).join("")}</li>`;
        const bv = s.bridgeVerdict, ev = s.edgeVerdicts, xv = s.explanationVerdict;
        return `<div class="card"><div class="cardHead"><span class="status ${s.status}">${STATUS[s.status]}</span>
            <button data-open="${esc(s.note)}" title="${esc(s.note)}">${esc(s.note)}</button></div>
          <p class="know">${esc(s.knowledge)}</p>
          <p class="path">${esc(s.explainedBy.model)} 가 씀</p>
          <p class="path"><b>${esc(s.source)}</b> → ${esc(s.bridge)} → <b>${esc(s.target)}</b>${s.statusReasons.length && s.status !== "candidate" ? ` · ${esc(s.statusReasons.join(", "))}` : ""}</p>
          <div class="checks"><span>매개 개념: ${OUT[bv?.decision] || "검증 못 함"}</span>
            ${ev.map((v, i) => `<span>간선 ${i + 1}: ${OUT[v.outcome]}</span>`).join("")}<span>설명: ${OUT[xv.overall]}</span></div>
          <details><summary>근거와 판정 이유</summary><ul class="steps">${step(s1)}${step(s2)}</ul>
            <ul class="steps">${bv ? `<li>매개 개념 — ${esc(bv.reason)}</li>` : ""}${ev.map((v, i) => `<li>간선 ${i + 1} — ${esc(v.reason)}</li>`).join("")}
              ${xv.claimVerdicts.map((c) => `<li>${esc(c.claimRef)}: ${OUT[c.outcome]} — ${esc(c.reason)}</li>`).join("")}
              ${xv.gaps.map((g) => `<li>빈 단계${g.stepOrder ? " " + g.stepOrder : ""} — ${esc(g.reason)}</li>`).join("")}</ul></details>
        </div>`;
      }).join("") || `<p class="empty">제안이 없다. 한 노트의 관계(A→B)와 다른 노트의 관계(B→C)가 같은 개념 B 로 이어질 때 제안이 생긴다.</p>`;
      out += `<details><summary>합성 규칙 (예시 정책)</summary><p class="path">${G.rules.map(esc).join(" · ")}</p></details>`;
    }
    body.innerHTML = `<div class="col">${head}${out}</div>`;
    body.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => openNote(b.dataset.open).then(run)));
  } else if (S.mode === "links" && S.scope === "all") {
    const G = S.all, toggle = scopeToggle();
    if (!G || G === "loading" || G.error) {
      body.className = "body single";
      body.innerHTML = `<div class="col">${toggle}${G === "loading" ? loading : G?.error ? `<p class="error">${esc(G.error)}</p>` : ""}</div>`;
    } else {
      body.className = "body";
      body.innerHTML = `<div class="col">${toggle}
          <p class="count">노트 ${G.nodes.length}개 · 노트마다 가장 강한 연결 3개를 선으로 · 신뢰도 ${S.thr.toFixed(2)} 이상인 개념만 · 맨 아래 줄은 연결이 없는 노트 · 점을 끌어 옮길 수 있다</p>
          <div class="graphWrap allWrap">${allSvg(G)}</div></div><div class="col side">${allPanel(G)}</div>`;
      bindPanZoom(body.querySelector(".allWrap svg"));
      attachSim(body.querySelector(".allWrap svg"), G.sim);
      body.querySelectorAll("[data-anode]").forEach((el) => el.addEventListener("click", () => {
        if (wasDragged(el)) return;
        S.allSel = S.allSel === el.dataset.anode ? null : el.dataset.anode; S.allEdge = null; S.allDetail = null; render();
      }));
      body.querySelectorAll("[data-aedge]").forEach((el) => el.addEventListener("click", () => loadEdge(el.dataset.aedge)));
    }
    body.querySelectorAll("[data-focus]").forEach((b) => b.addEventListener("click", () => {
      S.scope = "note"; openNote(b.dataset.focus).then(run);
    }));
    body.querySelectorAll("[data-scope]").forEach((b) => b.addEventListener("click", () => { S.scope = b.dataset.scope; run(); }));
  } else if (S.mode === "links") {
    const L = S.links;
    if (!L || L === "loading" || L.error || !L.nodes) {
      body.className = "body single";
      let out = S.note === FREE ? `<div style="margin-bottom:12px">${source}</div>` : "";
      out += L === "loading" ? loading : L?.error ? `<p class="error">${esc(L.error)}</p>` : "";
      body.innerHTML = `<div class="col">${scopeToggle()}${head}${out}</div>`;
    } else {
      body.className = "body";
      const lonely = L.nodes.length < 2;
      body.innerHTML = `<div class="col">${scopeToggle()}${head}${S.note === FREE ? `<div style="margin-bottom:12px">${source}</div>` : ""}
          <p class="count">이어진 노트 ${L.nodes.length - 1}개 · 선 ${L.edges.length}개 · 선을 누르면 두 노트가 어떻게 이어지는지 보여 준다. 노트를 누르면 가운데로 옮기고, 끌면 자리를 옮긴다.</p>
          ${lonely ? `<p class="empty">이어진 노트가 없다. 기준을 낮춰 본다.</p>` : `<div class="graphWrap">${graphSvg(L)}</div>`}</div>
        <div class="col side">${edgePanel(L)}</div>`;
      if (!lonely) attachSim(body.querySelector(".graphWrap svg"), L.sim);
      body.querySelectorAll("[data-edge]").forEach((el) => el.addEventListener("click", () => { S.edge = el.dataset.edge; render(); }));
      body.querySelectorAll("[data-node]").forEach((el) => el.addEventListener("click", () => {
        if (wasDragged(el)) return;
        if (el.dataset.node !== L.center) openNote(el.dataset.node).then(run);
      }));
    }
    body.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => openNote(b.dataset.open).then(run)));
    body.querySelectorAll("[data-scope]").forEach((b) => b.addEventListener("click", () => { S.scope = b.dataset.scope; run(); }));
  } else {
    const C = S.concepts;
    let side = "";
    if (C === "loading") side = loading;
    else if (C?.error) side = `<p class="error">${esc(C.error)}</p>`;
    else if (Array.isArray(C)) {
      const ok = C.filter(valid), low = C.filter((c) => !valid(c));
      const row = (c) => `<li class="${valid(c) ? "" : "invalid"}"><button class="row" data-c="${c.ref}" aria-current="${c.ref === S.sel}">
        <span class="lbl">${esc(c.label)}</span><span class="meter"><i style="width:${Math.round(c.confidence * 100)}%"></i></span>
        <span class="conf">${c.confidence.toFixed(2)}</span></button></li>`;
      side = `<p class="count">유효 개념 ${ok.length} / ${C.length}</p><ul class="list">${ok.map(row).join("")}
        ${low.length ? `<li class="cut">기준 미만 ${low.length}</li>${low.map(row).join("")}` : ""}</ul>`;
    }
    body.className = "body";
    body.innerHTML = `<div class="col">${head}${source}</div><div class="col">${side}</div>`;
    const pick = (ref) => {
      S.sel = S.sel === ref ? null : ref; render();
      if (S.sel) document.querySelector("#text .m.on")?.scrollIntoView({ block: "center", behavior: "smooth" });
    };
    body.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => pick(b.dataset.c)));
    body.querySelectorAll("#text .m").forEach((m) => m.addEventListener("click", () => pick(m.dataset.ref)));
  }
  $("#free")?.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); run(); } });
}

// 유효 개념만 원문에 칠한다. 계약 offset 은 UTF-16 이라 JS 문자열 위치와 같다
function marked() {
  const marks = [];
  for (const c of S.concepts.filter(valid)) for (const m of c.mentions) marks.push({ s: m.startOffset, e: m.endOffset, c });
  marks.sort((a, b) => a.s - b.s || b.e - a.e);
  let html = "", at = 0;
  for (const m of marks) {
    if (m.s < at) continue;
    html += esc(S.text.slice(at, m.s))
      + `<span class="m${m.c.ref === S.sel ? " on" : ""}" data-ref="${m.c.ref}" title="${esc(m.c.label)} · ${m.c.confidence.toFixed(2)}">${esc(S.text.slice(m.s, m.e))}</span>`;
    at = m.e;
  }
  return html + esc(S.text.slice(at));
}

init();
</script>
