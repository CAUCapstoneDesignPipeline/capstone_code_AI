# AI 서버 CI: 시험과 Docker 이미지 확인. 비밀값을 쓰지 않는다 (LLM 은 시험에서 가짜로 바꾼다).
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "0.12.19"            # Dockerfile 의 uv 와 같다
          enable-cache: true
      - name: 의존성 (uv.lock 그대로)
        run: uv sync --frozen --python 3.11
      - name: 시험
        run: uv run --frozen pytest -q

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: 이미지 빌드
        run: docker build --platform linux/amd64 --build-arg UV_EXTRAS="--extra embeddings" -t capstone-ai:ci --build-arg SOURCE_REVISION=${{ github.sha }} .
      - name: 컨테이너가 healthy 가 되는지 (HEALTHCHECK = /internal/v1/health/live)
        run: |
          docker run -d --name ai -e AI_SERVICE_TOKEN=ci-only-token capstone-ai:ci
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' ai)
            [ "$s" = healthy ] && exit 0
            [ "$s" = unhealthy ] && break
            sleep 5
          done
          docker logs ai
          exit 1
      - name: 개발용 playground 가 이미지에 없는지
        run: |
          code=$(docker exec ai python -c "import urllib.request,urllib.error
          try: urllib.request.urlopen('http://127.0.0.1:8000/dev/', timeout=2); print(200)
          except urllib.error.HTTPError as e: print(e.code)")
          [ "$code" = 404 ]
      - name: CPU BGE-M3 고정 revision·합성 IDF·health/profile smoke
        run: |
          docker run --rm --platform linux/amd64 --entrypoint python \
            -v "$PWD/deploy/gcp/image_smoke.py:/opt/image_smoke.py:ro" \
            capstone-ai:ci /opt/image_smoke.py
      - name: CI 컨테이너 정리
        if: always()
        run: docker rm -f ai
