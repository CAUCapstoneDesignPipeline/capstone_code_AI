name: Automatic GCP AI release
on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      operation:
        description: deploy publishes and releases this commit; rollback restores the previous AI release
        type: choice
        options: [deploy, rollback]
        default: deploy
        required: true
permissions:
  contents: read
concurrency:
  group: gcp-cd-ai
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'CAUCapstoneDesignPipeline/capstone_code_AI' && github.ref == 'refs/heads/develop' && vars.GCP_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.operation == 'deploy')
    uses: ./.github/workflows/gcp-publish-image.yml
    permissions:
      contents: read
      id-token: write
  # BE 배포 도구(고정 커밋)가 attestation 넓히기 → AI 교체 → 좁히기를 한다 (BE deploy/gcp/ai_auto.py).
  release:
    needs: publish
    if: always() && github.repository == 'CAUCapstoneDesignPipeline/capstone_code_AI' && github.ref == 'refs/heads/develop' && vars.GCP_DEPLOY_ENABLED == 'true' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && inputs.operation == 'rollback'))
    uses: CAUCapstoneDesignPipeline/capstone_code_BE/.github/workflows/gcp-ai-cd-reusable.yml@8575d45c1b9884d241cd776ffd75704e367f16d3
    permissions:
      contents: read
      id-token: write
    with:
      operation: ${{ inputs.operation || 'deploy' }}
      source_sha: ${{ github.sha }}
      image_digest: ${{ needs.publish.outputs.digest }}
      deploy_tool_sha: 8575d45c1b9884d241cd776ffd75704e367f16d3
  # 자동 배포가 멈추면 이 저장소에 이슈를 열거나 댓글을 단다 (BE .github/workflows/gcp-cd-notify.yml).
  notify:
    needs: [publish, release]
    if: failure() && github.repository == 'CAUCapstoneDesignPipeline/capstone_code_AI'
    uses: CAUCapstoneDesignPipeline/capstone_code_BE/.github/workflows/gcp-cd-notify.yml@8575d45c1b9884d241cd776ffd75704e367f16d3
    permissions:
      contents: read
      issues: write
    with:
      component: ai
      stop_reason: ${{ needs.release.outputs.stop_reason }}
