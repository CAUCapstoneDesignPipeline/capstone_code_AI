name: Automatic GCP AI release
on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      operation:
        description: deploy publishes and releases this commit; rollback restores the previous AI release
        type: choice
        options: [deploy, rollback]
        default: deploy
        required: true
permissions:
  contents: read
concurrency:
  group: gcp-cd-ai
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'CAUCapstoneDesignPipeline/capstone_code_AI' && github.ref == 'refs/heads/develop' && vars.GCP_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.operation == 'deploy')
    uses: ./.github/workflows/gcp-publish-image.yml
    permissions:
      contents: read
      id-token: write
  # BE 배포 도구(고정 커밋)가 attestation 넓히기 → AI 교체 → 좁히기를 한다 (BE deploy/gcp/ai_auto.py).
  release:
    needs: publish
    if: always() && github.repository == 'CAUCapstoneDesignPipeline/capstone_code_AI' && github.ref == 'refs/heads/develop' && vars.GCP_DEPLOY_ENABLED == 'true' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && inputs.operation == 'rollback'))
    uses: CAUCapstoneDesignPipeline/capstone_code_BE/.github/workflows/gcp-ai-cd-reusable.yml@ac28f0fbe226029f46164273d4a605abe376d540
    permissions:
      contents: read
      id-token: write
    with:
      operation: ${{ inputs.operation || 'deploy' }}
      source_sha: ${{ github.sha }}
      image_digest: ${{ needs.publish.outputs.digest }}
      deploy_tool_sha: ac28f0fbe226029f46164273d4a605abe376d540
