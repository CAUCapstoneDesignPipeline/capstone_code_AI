name: gcp-ai-deploy
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [deploy, rollback]
        required: true
      manifest_path:
        description: Reviewed deploy/gcp/releases/<releaseId>.json in GCP_RELEASE_MANIFEST_SHA
        type: string
        required: true
      expected_release:
        description: Exact current release ID or none for first installation
        type: string
        required: true
      operation_id:
        description: Stable unique operation ID; reuse only with identical request
        type: string
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: github.repository == 'CAUCapstoneDesignPipeline/capstone_code_AI' && github.ref == 'refs/heads/develop' && vars.GCP_DEPLOY_ENABLED == 'true'
    uses: CAUCapstoneDesignPipeline/capstone_code_AI/.github/workflows/gcp-deploy-reusable.yml@d50a4c135aa79896d18053d323ecf1208cff068f
    with:
      operation: ${{ inputs.operation }}
      manifest_path: ${{ inputs.manifest_path }}
      expected_release: ${{ inputs.expected_release }}
      operation_id: ${{ inputs.operation_id }}
      deploy_tool_sha: d50a4c135aa79896d18053d323ecf1208cff068f
